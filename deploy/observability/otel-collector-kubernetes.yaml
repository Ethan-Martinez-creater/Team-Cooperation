apiVersion: v1
kind: ServiceAccount
metadata:
  name: coifesp-otel-collector
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coifesp-otel-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            tls:
              cert_file: /var/run/secrets/coifesp-otel-tls/tls.crt
              key_file: /var/run/secrets/coifesp-otel-tls/tls.key
          http:
            endpoint: 0.0.0.0:4318
            tls:
              cert_file: /var/run/secrets/coifesp-otel-tls/tls.crt
              key_file: /var/run/secrets/coifesp-otel-tls/tls.key
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 384
        spike_limit_mib: 96
      resource:
        attributes:
          - key: deployment.environment.name
            value: ${env:COIFESP_DEPLOYMENT_ENVIRONMENT}
            action: upsert
      batch:
        send_batch_size: 1024
        send_batch_max_size: 2048
        timeout: 5s
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      file_storage:
        directory: /var/lib/otelcol/storage
        compaction:
          on_start: true
          directory: /var/lib/otelcol/storage
    exporters:
      otlp/traces:
        endpoint: ${env:COIFESP_OTEL_UPSTREAM_ENDPOINT}
        tls:
          insecure: false
          ca_file: /var/run/secrets/coifesp-otel-upstream/ca.crt
        headers:
          authorization: ${env:COIFESP_OTEL_UPSTREAM_AUTHORIZATION}
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          storage: file_storage
          queue_size: 10000
          num_consumers: 4
    service:
      extensions: [health_check, file_storage]
      telemetry:
        logs: {level: info, encoding: json}
        metrics:
          level: normal
          readers:
            - pull:
                exporter:
                  prometheus: {host: 0.0.0.0, port: 8888}
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp/traces]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: coifesp-otel-collector
spec:
  serviceName: coifesp-otel-collector-headless
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: coifesp-otel-collector}
  template:
    metadata:
      labels: {app: coifesp-otel-collector}
    spec:
      serviceAccountName: coifesp-otel-collector
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: coifesp-otel-collector}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app: coifesp-otel-collector}
      containers:
        - name: collector
          image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.153.0@sha256:93aad750175cbf1a973ae1c5886c3371f4d800f61be25cdd26870b8441ffe9fa
          imagePullPolicy: IfNotPresent
          args: ["--config=/conf/config.yaml"]
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: health, containerPort: 13133}
            - {name: metrics, containerPort: 8888}
          env:
            - name: COIFESP_OTEL_UPSTREAM_ENDPOINT
              valueFrom: {secretKeyRef: {name: coifesp-otel-upstream, key: endpoint}}
            - name: COIFESP_OTEL_UPSTREAM_AUTHORIZATION
              valueFrom: {secretKeyRef: {name: coifesp-otel-upstream, key: authorization}}
            - name: COIFESP_DEPLOYMENT_ENVIRONMENT
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          volumeMounts:
            - {name: config, mountPath: /conf, readOnly: true}
            - {name: storage, mountPath: /var/lib/otelcol/storage}
            - {name: receiver-tls, mountPath: /var/run/secrets/coifesp-otel-tls, readOnly: true}
            - {name: upstream-tls, mountPath: /var/run/secrets/coifesp-otel-upstream, readOnly: true}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /, port: health}
            initialDelaySeconds: 5
            timeoutSeconds: 2
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /, port: health}
            initialDelaySeconds: 15
            timeoutSeconds: 2
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: config
          configMap: {name: coifesp-otel-collector}
        - name: receiver-tls
          secret: {secretName: coifesp-otel-receiver-tls, defaultMode: 288}
        - name: upstream-tls
          secret: {secretName: coifesp-otel-upstream, defaultMode: 288}
  volumeClaimTemplates:
    - metadata: {name: storage}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: coifesp-otel-collector
spec:
  selector: {app: coifesp-otel-collector}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
---
apiVersion: v1
kind: Service
metadata:
  name: coifesp-otel-collector-headless
spec:
  clusterIP: None
  selector: {app: coifesp-otel-collector}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: coifesp-otel-collector
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: coifesp-otel-collector-metrics}
  endpoints:
    - {port: metrics, path: /metrics, interval: 30s}
---
apiVersion: v1
kind: Service
metadata:
  name: coifesp-otel-collector-metrics
  labels: {app.kubernetes.io/name: coifesp-otel-collector-metrics}
spec:
  selector: {app: coifesp-otel-collector}
  ports:
    - {name: metrics, port: 8888, targetPort: metrics}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: coifesp-otel-collector
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: coifesp-otel-collector}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coifesp-otel-collector
spec:
  podSelector:
    matchLabels: {app: coifesp-otel-collector}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {coifesp.dev/telemetry-client: "true"}
      ports:
        - {protocol: TCP, port: 4317}
        - {protocol: TCP, port: 4318}
    - from:
        - namespaceSelector:
            matchLabels: {coifesp.dev/monitoring: "true"}
      ports:
        - {protocol: TCP, port: 8888}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels: {coifesp.dev/telemetry-upstream: "true"}
      ports:
        - {protocol: TCP, port: 4317}
        - {protocol: TCP, port: 443}

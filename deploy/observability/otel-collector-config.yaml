receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        tls:
          cert_file: ${env:COIFESP_OTEL_TLS_CERT_FILE}
          key_file: ${env:COIFESP_OTEL_TLS_KEY_FILE}
      http:
        endpoint: 0.0.0.0:4318
        tls:
          cert_file: ${env:COIFESP_OTEL_TLS_CERT_FILE}
          key_file: ${env:COIFESP_OTEL_TLS_KEY_FILE}
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  resource:
    attributes:
      - key: deployment.environment.name
        value: ${env:COIFESP_DEPLOYMENT_ENVIRONMENT}
        action: upsert
  batch:
    send_batch_size: 1024
    send_batch_max_size: 2048
    timeout: 5s
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: /var/lib/otelcol/storage
    compaction:
      on_start: true
      directory: /var/lib/otelcol/storage
exporters:
  otlp/traces:
    endpoint: ${env:COIFESP_OTEL_UPSTREAM_ENDPOINT}
    tls:
      insecure: false
      ca_file: ${env:COIFESP_OTEL_UPSTREAM_CA_FILE}
    headers:
      authorization: ${env:COIFESP_OTEL_UPSTREAM_AUTHORIZATION}
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      storage: file_storage
      queue_size: 10000
      num_consumers: 4
service:
  extensions: [health_check, file_storage]
  telemetry:
    logs:
      level: info
      encoding: json
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/traces]

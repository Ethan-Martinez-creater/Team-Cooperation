apiVersion: v1
kind: ServiceAccount
metadata:
  name: coifesp-control-plane
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coifesp-agent-worker
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coifesp-tool-worker
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coifesp-runtime-no-access
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coifesp-runtime-no-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coifesp-runtime-no-access
subjects:
  - kind: ServiceAccount
    name: coifesp-control-plane
  - kind: ServiceAccount
    name: coifesp-agent-worker
  - kind: ServiceAccount
    name: coifesp-tool-worker


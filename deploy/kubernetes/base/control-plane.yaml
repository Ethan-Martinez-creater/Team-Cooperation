apiVersion: apps/v1
kind: Deployment
metadata:
  name: coifesp-control-plane
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coifesp
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coifesp
        app.kubernetes.io/component: control-plane
    spec:
      serviceAccountName: coifesp-control-plane
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: coifesp
              app.kubernetes.io/component: control-plane
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: coifesp
              app.kubernetes.io/component: control-plane
      containers:
        - name: control-plane
          image: example.invalid/coifesp/harness@sha256:1111111111111111111111111111111111111111111111111111111111111111
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn"]
          args:
            - coifesp_harness.control_plane.bootstrap:create_application
            - --factory
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --workers
            - "1"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: coifesp-control-plane-config
          env:
            - name: HOME
              value: /tmp
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: COIFESP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: coifesp-control-plane-secrets
                  key: database-url
            - name: COIFESP_AUDIT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: coifesp-control-plane-secrets
                  key: audit-signing-key
            - name: COIFESP_ENVELOPE_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: coifesp-control-plane-secrets
                  key: envelope-signing-key
            - name: COIFESP_MEMORY_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: coifesp-control-plane-secrets
                  key: memory-master-key
            - name: COIFESP_METRICS_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: coifesp-control-plane-secrets
                  key: metrics-bearer-token
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 3
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/nonroot
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: home
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: coifesp-control-plane
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: coifesp
    app.kubernetes.io/component: control-plane
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

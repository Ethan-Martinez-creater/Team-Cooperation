apiVersion: apps/v1
kind: Deployment
metadata:
  name: coifesp-agent-worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coifesp
      app.kubernetes.io/component: agent-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coifesp
        app.kubernetes.io/component: agent-worker
    spec:
      serviceAccountName: coifesp-agent-worker
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 660
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: coifesp
              app.kubernetes.io/component: agent-worker
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: coifesp
              app.kubernetes.io/component: agent-worker
      containers:
        - name: agent-worker
          image: example.invalid/coifesp/harness@sha256:1111111111111111111111111111111111111111111111111111111111111111
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "coifesp_harness.worker_main"]
          envFrom:
            - configMapRef:
                name: coifesp-agent-worker-config
          env:
            - name: HOME
              value: /tmp
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: COIFESP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: coifesp-agent-worker-secrets
                  key: database-url
            - name: COIFESP_WORKER_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: coifesp-agent-worker-secrets
                  key: worker-client-secret
            - name: COIFESP_DIRECTORY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: coifesp-agent-worker-secrets
                  key: directory-client-secret
            - name: COIFESP_AUDIT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: coifesp-agent-worker-secrets
                  key: audit-signing-key
            - name: COIFESP_ENVELOPE_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: coifesp-agent-worker-secrets
                  key: envelope-signing-key
            - name: COIFESP_MEMORY_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: coifesp-agent-worker-secrets
                  key: memory-master-key
            - name: COIFESP_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: coifesp-agent-worker-secrets
                  key: llm-api-key
          startupProbe: &agent-process-probe
            exec:
              command: ["python", "-c", "import os; os.kill(1, 0)"]
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 2
          readinessProbe:
            <<: *agent-process-probe
            failureThreshold: 3
            periodSeconds: 10
          livenessProbe:
            <<: *agent-process-probe
            failureThreshold: 3
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/nonroot
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: home
          emptyDir:
            sizeLimit: 32Mi

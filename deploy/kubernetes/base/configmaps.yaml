apiVersion: v1
kind: ConfigMap
metadata:
  name: coifesp-control-plane-config
data:
  COIFESP_ENV: production
  COIFESP_OIDC_ISSUER: https://identity.invalid/realms/replace-me
  COIFESP_OIDC_AUDIENCE: coifesp-control-plane
  COIFESP_OIDC_AUTHORIZED_PARTIES: replace-me-control-client
  COIFESP_OIDC_JWKS_URL: https://identity.invalid/realms/replace-me/protocol/openid-connect/certs
  COIFESP_OIDC_ALGORITHMS: RS256
  COIFESP_AUDIT_KEY_ID: active-v1
  COIFESP_ENVELOPE_KEY_ID: active-v1
  COIFESP_MEMORY_KEY_ID: active-v1
  COIFESP_SERVICE_NAME: coifesp-control-plane
  COIFESP_TELEMETRY_ENABLED: "true"
  COIFESP_OTLP_TRACES_ENDPOINT: https://coifesp-otel-collector:4318/v1/traces
  COIFESP_TRACE_SAMPLE_RATIO: "0.1"
  COIFESP_METRICS_ENABLED: "true"
  COIFESP_STRUCTURED_LOGGING: "true"
  COIFESP_LOG_LEVEL: INFO
---
